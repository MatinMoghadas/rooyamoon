openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/cards/:
    get:
      operationId: api_cards_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        statusCode:
                          type: integer
                          example: 200
                        messages:
                          type: array
                          items:
                            type: string
                          example:
                          - Cards retrieved successfully.
                        total:
                          type: integer
                          example: 100
                        page:
                          type: integer
                          example: 1
                        perPage:
                          type: integer
                          example: 10
                        result:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              content:
                                type: string
                                example: This is a sample card
                              creator:
                                type: string
                                example: Creator Username
                              created_at:
                                type: string
                                example: '2023-03-05T12:34:56Z'
                              is_saved:
                                type: boolean
                                example: true
          description: ''
    post:
      operationId: api_cards_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Card'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Card'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Card'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  messages:
                    type: array
                    items:
                      type: string
                    example:
                    - Card created successfully.
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      content:
                        type: string
                        example: This is a sample card
                      creator:
                        type: string
                        example: Creator Username
                      created_at:
                        type: string
                        example: '2023-03-05T12:34:56Z'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  messages:
                    type: array
                    items:
                      type: string
                    example:
                    - Failed to create card.
                  errors:
                    type: object
          description: ''
  /api/cards/{card_id}/comments-replies/:
    get:
      operationId: api_cards_comments_replies_retrieve
      parameters:
      - in: path
        name: card_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  messages:
                    type: array
                    items:
                      type: string
                    example:
                    - Comments and replies retrieved successfully.
                  total:
                    type: integer
                    example: 5
                  result:
                    type: object
                    properties:
                      card_id:
                        type: integer
                        example: 1
                      comments:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            content:
                              type: string
                              example: This is a comment
                            card:
                              type: integer
                              example: 1
                            creator:
                              type: string
                              example: User1
                            created_at:
                              type: string
                              example: '2023-03-05T12:34:56Z'
                            updated_at:
                              type: string
                              example: '2023-03-05T12:34:56Z'
                            replies:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    example: 1
                                  comment:
                                    type: integer
                                    example: 1
                                  user:
                                    type: string
                                    example: User2
                                  content:
                                    type: string
                                    example: This is a reply
                                  created_at:
                                    type: string
                                    example: '2023-03-05T13:00:00Z'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  messages:
                    type: array
                    items:
                      type: string
                    example:
                    - Card not found.
          description: ''
  /api/cards/{id}/:
    get:
      operationId: api_cards_retrieve

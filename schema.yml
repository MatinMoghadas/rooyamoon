components:
  schemas:
    Card:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: string
        challenge:
          type: string
        creator:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        like_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_saved:
          type: string
          readOnly: true
      required:
      - challenge
      - content
      - created_at
      - creator
      - id
      - is_saved
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: string
        card:
          type: integer
        creator:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        like_count:
          type: integer
          readOnly: true
      required:
      - card
      - content
      - created_at
      - creator
      - id
      - like_count
      - updated_at
    CommentReply:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        comment:
          type: integer
        user:
          type: string
          readOnly: true
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        like_count:
          type: integer
          readOnly: true
      required:
      - comment
      - content
      - created_at
      - id
      - like_count
      - user
    Login:
      type: object
      properties:
        mobile_phone_number:
          type: string
          maxLength: 12
      required:
      - mobile_phone_number
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        title:
          type: string
          nullable: true
          maxLength: 255
        message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        related_entity:
          allOf:
          - $ref: '#/components/schemas/Card'
          readOnly: true
      required:
      - created_at
      - id
      - message
      - owner
      - related_entity
    OTPLogin:
      type: object
      properties:
        mobile_phone_number:
          type: string
          maxLength: 12
        otp:
          type: string
          writeOnly: true
          maxLength: 5
          minLength: 5
      required:
      - mobile_phone_number
      - otp
    PatchedCard:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: string
        challenge:
          type: string
        creator:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        like_count:

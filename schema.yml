                    - Card not found.
          description: ''
    put:
      operationId: api_cards_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this card.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Card'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Card'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Card'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  messages:
                    type: array
                    items:
                      type: string
                    example:
                    - Card updated successfully.
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      content:
                        type: string
                        example: This is an updated card
                      creator:
                        type: string
                        example: Creator Username
                      created_at:
                        type: string
                        example: '2023-03-05T12:34:56Z'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  messages:
                    type: array
                    items:
                      type: string
                    example:
                    - Failed to update card.
                  errors:
                    type: object
          description: ''
    patch:
      operationId: api_cards_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this card.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCard'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCard'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  messages:
                    type: array
                    items:
                      type: string
                    example:
                    - Card partially updated successfully.
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      content:
                        type: string
                        example: This is an updated card
                      creator:
                        type: string
                        example: Creator Username
                      created_at:
                        type: string
                        example: '2023-03-05T12:34:56Z'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  messages:
                    type: array
                    items:
                      type: string
                    example:
                    - Failed to partially update card.
                  errors:
                    type: object
          description: ''
    delete:
      operationId: api_cards_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this card.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 204
                  messages:
                    type: array
                    items:
                      type: string
                    example:
                    - Card deleted successfully.
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 404
